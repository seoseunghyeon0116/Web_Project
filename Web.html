<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐먹지</title>
    <link rel="stylesheet" href="web.css">

</head>
<body>
    <div class="container">
        <header>
            <div class="logo">오늘 뭐 먹지</div>
            <div class="location">대구대 캠퍼스 근처 1km이내</div>
        </header>
    

    <section class="box1">
        <h1>뭐 먹지?<br> 더이상 고민하지마!</h1>

        <p>원하는 가격입력하면<br> 대구대 주변식당에서 메뉴를 추천해드립니다.</p>
    </section>

    <section class="search-box">
        <div>
            <label for="budget">1인 예산 (원)</label>
            <input type="number" id="budget" value="7000" min="1" placeholder="예:7000">
        </div>

        <div>
            <label for="category">음식 종류</label>
            <select id="category">
                <option value="전체">전체</option>
                <option value="양식">양식</option>
                <option value="중식">중식</option>
                <option value="일식">일식</option>
                <option value="한식">한식</option>
                <option value="전체">패스트푸드</option>
                <option value="전체">분식</option>
            </select>
        </div>

        <div>
            <label for="sort">정렬방식</label>
            <select id="sort">
                <option value="가격">가격순</option>
                <option value="거리">거리순</option>
            </select>
        </div>
    
    <div class="button">
        <button id="allBtn" onclick="recommendFood()">전체메뉴 보기</button>
        <button id="randomBtn" class="random-button" onclick="randomRecommend()">랜덤메뉴 추천</button>
    </div>
    <p class="hint">금액에 맞는 메뉴를 검색하거나 랜덤으로 추천받아보세요</p>

    <div class="result-header">
        <h2 id="resultTitle">예산에 맞는 식당</h2>
        <div class="count" id="count">0개 메뉴</div>

        <div class="results" id="results"></div>
    </div>
    
    
    <div class="notice">
        <b>-이용 안내-</b>

        <p>
            *가격은 1인 기준입니다.<br>
            *식당과 메뉴의 실제 가격은 변동될수있습니다.<br>
            *금액 입력시 그 금액부터 낮은 순으로 나타납니다.
        </p>

    </div>

    <footer>오늘 뭐 먹지? 앞으론 고민하지말고 추천받자 </footer>

    </div>

    <script src="web.js"></script>
</body>
</html>
